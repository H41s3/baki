name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        # pandas and pytest aren't in requirements.txt yet, so install them explicitly
        run: pip install -r requirements.txt pandas==3.1.0 pytest==8.2.0
      - name: Run tests
        run: python -m pytest -v preprocessing_deep_learning/DataWrangling
